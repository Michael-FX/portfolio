<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Formas</title>
    <link href="css/stils.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Formas un ievadlauku piemērs</h1>
    <form>
      <p>Šodienas datums <input name="datums" /></p>
      <p>
        Ja gribi uzzināt šodienas datumu, spied pogu DATUMS
        <input
          onclick="datums.value = new Date()"
          name="poga"
          value="DATUMS"
          type="button"
        />
      </p>
      <p>
        Ja gribi izdzēst datumua lodziņa saturu, spied pogu RESET
        <input value="RESET" type="reset" />
      </p>
    </form>
    <form>
      <div>1.skaitlis<input type="text" name="sk1" /></div>
      <div>
        <input
          value="+"
          name="plus"
          onclick="rez.value = parseFloat(sk1.value) + parseFloat(sk2.value)"
          type="button"
        />
        <input
          value="-"
          name="minus"
          onclick="rez.value = parseFloat(sk1.value) - parseFloat(sk2.value)"
          type="button"
        />
        <input
          value="X"
          name="reiz"
          onclick="rez.value = parseFloat(sk1.value) * parseFloat(sk2.value)"
          type="button"
        />
        <input
          value="/"
          name="dalit"
          onclick="rez.value = parseFloat(sk1.value) / parseFloat(sk2.value)"
          type="button"
        />
        <input
          value="RESET"
          name="reset"
          onclick="
            sk1.value = '';
            sk2.value = '';
            rez.value = '';
          "
          type="button"
        />
      </div>
      <div>2.skaitlis<input type="text" name="sk2" /></div>
      <hr />
      <div>Rezultāts<input name="rez" /></div>
    </form>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        padding: 20px;
        font-size: 40px;
        text-align: center;
      }
      form {
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        display: inline-block;
        margin-top: 20px;
      }
      input[type="text"] {
        padding: 10px;
        font-size: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        width: 200px;
        margin: 10px;
      }
      input[type="button"],
      input[type="reset"] {
        padding: 10px 20px;
        font-size: 20px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: #fff;
        cursor: pointer;
        margin: 10px;
      }
      input[type="button"]:hover,
      input[type="reset"]:hover {
        background-color: #0056b3;
      }
      input[name="datums"] {
        padding: 20px;
        width: 500px;
        font-size: 20px;
      }
      input[name="rez"] {
        padding: 20px;
        width: 500px;
        font-size: 20px;
        margin: 5px;
      }
    </style>
  </body>
</html>
